<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAPPY BIRTHDAY, MAHAL KOOO! 🤍</title>
<style>
    body {
        background: #2e2e2e; /* dark gray background */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: "Courier New", monospace; /* typewriter font */
        color: #1e3a8a; /* dark blue font */
        text-align: center;
    }

    h1 {
        font-size: 2em;
        margin-bottom: 15px;
        font-weight: 600;
        color: #1e3a8a;
    }

    p {
        font-size: 1.1em;
        margin-bottom: 30px;
        color: #1e40af;
    }

    button {
        background: #4b5563; /* gray button */
        color: #1e3a8a; /* dark blue text */
        padding: 12px 25px;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-family: "Courier New", monospace;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.3s ease, transform 0.2s ease;
        margin: 10px;
        position: relative;
    }

    button:hover {
        background: #6b7280; /* lighter gray */
        transform: scale(1.05);
    }

    /* Lined-paper style letter box */
    #letterBox {
        display: none;
        background: repeating-linear-gradient(
            to bottom,
            #e5e7eb 0px,  /* very light line */
            #e5e7eb 1px,
            #d1d5db 2px   /* space between lines */
        );
        color: #1e3a8a; /* dark blue text */
        padding: 30px 30px 30px 50px; /* left padding to avoid dots */
        border-radius: 15px;
        width: 90%;
        max-width: 700px;
        font-size: 1.1em;
        line-height: 1.8em; /* spacing for readability */
        white-space: pre-wrap;
        overflow-wrap: break-word;
        font-family: "Courier New", monospace;
        box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        margin-top: 20px;
        max-height: 600px;
        overflow-y: auto;
        position: relative;
    }

    #letterBox::before {
        content: "";
        position: absolute;
        top: 0;
        left: 20px; /* dots moved away from text */
        width: 20px;
        height: 100%;
        background-image: radial-gradient(circle, #2e2e2e 5px, transparent 6px);
        background-size: 20px 40px;
        background-repeat: repeat-y;
        pointer-events: none;
    }
</style>
</head>
<body>

<h1>HAPPY BIRTHDAY, MAHAL KO! 🤍</h1>
<p>I made this little space for you 🤍</p>

<!-- Buttons -->
<button id="playlistBtn">🎧 Playlist</button>
<button id="messageBtn">💌 Read Me</button>

<!-- Typewriter letter -->
<div id="letterBox">
    <p id="typedText"></p>
</div>

<!-- Background music (autoplay & loop) -->
<audio autoplay loop>
    <source src="dwta_-_Padaba_Taka__Lyric_Video_with_Tagalog_Translation_(256k).mp3" type="audio/mp3">
</audio>

<script>
// Birthday message
const message = `soooo, before this special day ends, I just want to tell you how much you mean to me and how wonderful you are 😝  

Cheers to the most amazing person in my lifeee rn! Happy 24th Birthday po, mahal kooo! 🎂  

You are the most genuine person I've ever met. Nasa tg palang tayo pero ramdam ko na, you are pure hihi. A kind soul with a pure heart! 🫶🏻 hindi man halata pero you inspire me in so many ways. Those actions, words, and little gestures of yours motivates me to be a better person hihi. And yung hardwork mo? top tier! I know na gamit na gamit na itong line na ito pero you really deserve all the love in the world hihi and as long as I am breathing, you will always be loved by me.  

You can always share everything with me, okay? your problems, your rants, your chikas, or kahit mga random thoughts HAHAHAHAHAHAHA willing and ready po akong mag listen 😝  And I just want you to know that whatever happens, I will always be your kakampi. Don't forget that 🤨  

Gusto ko happy din ikaw lagi and walang iniisip masyado because I will never be okay knowing na you struggle alone and wala akong magawa to ease that.  

I pray for your happiness, safety, and health hihi. I wish you achieve everything you've worked so hard for! I'll always be your biggest supporter, mahal kooo. I'm always here, cheering for you hihi. May all your dreams come trueee, mahal kooo! ♥️  

You're a year older than yesterday, pero ikaw pa rin ang baby ko hihi. Thank you for painting colors in my once dull life. I mean, happy naman ako before, but with you, it's different. You've filled my days with so much love, laughter and meaning. The kilig moments, the spicy ones, even yung mga tampuhan hihi I will never forget those memories I shared with you hihi. I never thought I could experience this kind of happiness. I'll always thank you for that. AGHH, MY SUNSHINEEE! I'm so lucky to have you and I'm just so glad you exist. Thank you for loving meeee! and thank you for choosing me every single day kahit na lagi kitang iniinis HAHAHAHAHAHAHAH apologies for that hihi. Thank you so much sa patience and understanding, it means so much to me hihi. Ang dami pang pumapasok sa isip ko pero hindi ko na ma-put into words huhu  

HAPPY BIRTHDAY AGAIN, MAHAL KOOO! I HOPE HAPPY KA TODAY HIHI LOOKING FORWARD TO CELEBRATING MORE BIRTHDAYS WITH ME, MAHAL NA MAHAL KITAAAA! 🤍  

AGHH, I WISH I COULD I HUG RN 😩`;

// Buttons
const playlistBtn = document.getElementById("playlistBtn");
const messageBtn = document.getElementById("messageBtn");
const letterBox = document.getElementById("letterBox");
const typedText = document.getElementById("typedText");

// Playlist button
playlistBtn.addEventListener("click", () => {
    window.open("https://open.spotify.com/playlist/0bty1Cx2iggeYtyGIv3pIg?si=ab9747a2bd0d4f73&pt=9b96dcd1416ab08379a6b7da69c97703", "_blank");
});

// Message button with typewriter effect
messageBtn.addEventListener("click", () => {
    alert("⚠️ ALERT! ⚠️");
    alert("This button contains extreme love and affection 🤪");
    alert("Click OK if you dare 🤭");

    messageBtn.style.display = "none";
    letterBox.style.display = "block";

    let i = 0;
    function typeWriter() {
        if (i < message.length) {
            typedText.innerHTML += message.charAt(i);
            i++;
            let randomDelay = Math.random() * 70 + 50; // 50-120ms
            setTimeout(typeWriter, randomDelay);
        }
    }
    typeWriter();
});
</script>
</body>
</html>
