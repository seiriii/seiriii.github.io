<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOOD DAY, MY PRETTY BABY! 🩷</title>
<style>
  body {
    background: #2e2e2e;
    color: #dbeafe;
    font-family: "Courier New", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    margin: 0;
  }

  .paper-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: repeating-linear-gradient(
      to bottom,
      #fdf6e3 0px,
      #fdf6e3 27px,
      #d2d2d2 28px
    );
    color: #0B1E5C;
    padding: 30px 30px 30px 70px;
    border-radius: 10px;
    line-height: 1.6em;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    font-family: "Courier New", monospace;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    position: relative;
    text-align: center;
  }

  .paper-box::before {
    content: "";
    position: absolute;
    top: 0;
    left: 20px;
    width: 20px;
    height: 100%;
    background-image: radial-gradient(circle, #2e2e2e 5px, transparent 6px);
    background-size: 20px 40px;
    background-repeat: repeat-y;
    pointer-events: none;
  }

  button {
    margin: 10px;
    padding: 12px 25px;
    border-radius: 8px;
    border: none;
    font-family: "Courier New", monospace;
    cursor: pointer;
    font-size: 16px;
  }

  .blue-btn {
    display: inline-block;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    padding: 15px 25px;
    color: #fff;
    font-weight: bold;
    text-align: center;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 20px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    transition: all 0.3s;
  }
  .blue-btn:hover {
    background: linear-gradient(135deg, #3a8dde, #00c6ff);
    transform: scale(1.05);
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
  }

</style>
</head>
<body>

<div class="paper-box">
  <img src="8bdd5cad0dca933d7ef52b353ef09aea.gif" alt="GIF" style="width:200px;height:200px;margin-bottom:20px;">
  <span>Do you love me?</span>
  <div>
    <button onclick="loveChoice(this)" value="yes">Yes</button>
    <button onclick="loveChoice(this)" value="no" id="noBtn">No</button>
  </div>
  <button class="blue-btn" onclick="goToProject2()">CLICK ME! 🎂</button>
</div>

<script>
let noBtn = document.getElementById("noBtn");
let clickCount = 0;

function loveChoice(btn){
  if(btn.value === "yes"){
    alert("NYE NYE");
    alert("HAPPY BIRTHDAY AGAIN! MWA 🤪");
    btn.parentElement.previousElementSibling.src = "f048598f500480b318789fd896f2ca09.gif";
  } else {
    clickCount++;
    btn.parentElement.previousElementSibling.src = "415ec7a8d9bded6c901b3858caba5358.gif";
    if(clickCount > 10){
      btn.style.opacity="0";
      btn.parentElement.previousElementSibling.nextElementSibling.innerText="AW, MY BABY DOESN'T LOVE ME ANYMOREEE 🥺";
    } else{
      btn.parentElement.previousElementSibling.nextElementSibling.innerText="ABA 🤨";
      let randomPos = Math.floor(Math.random()*400);
      btn.style.bottom=randomPos*1.02 + "px";
      btn.style.right=randomPos/2 + "px";
    }
  }
}

function goToProject2(){
  window.location.href = "project2.html"; // redirect to Project 2 page
}
</script>

</body>
</html>
