<style>
@import url('https://fonts.googleapis.com/css2?family=Rubik+Gemstones&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Anton&display=swap');

*{
  padding: 0;
  margin: 0;
  box-sizing: border-box;
  font-family: arial;
}

body {
  background: #2e2e2e; /* dark background like Project 2 */
  color: #dbeafe;
  font-family: "Courier New", monospace;
  text-align: center;
  min-height: 100vh;
}

.cover {
  width: 100%;
  height: 120vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.content {
  width: 300px;
  height: 300px;
  background: repeating-linear-gradient(
    to bottom,
    #fdf6e3 0px,
    #fdf6e3 27px,
    #d2d2d2 28px
  ); /* light paper lines like Project 2 */
  color: #0B1E5C; /* dark blue text */
  display: flex;
  position: absolute;
  justify-content: center;
  border-radius: 10px;
  top: 15%;
  flex-direction: column;
  align-items: center;
  padding: 30px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  text-align: center;
}

.content::before {
  content: "";
  position: absolute;
  top: 0;
  left: 20px;
  width: 20px;
  height: 100%;
  background-image: radial-gradient(circle, #2e2e2e 5px, transparent 6px);
  background-size: 20px 40px;
  background-repeat: repeat-y;
  pointer-events: none;
}

img{
  width: 200px;
  height: 200px;
  margin-bottom: 15px;
}

button {
  margin: 10px;
  padding: 12px 25px;
  border-radius: 8px;
  border: none;
  font-family: 'Anton', sans-serif;
  cursor: pointer;
  transition: transform 0.3s;
}

button:hover {
  transform: scale(1.1);
}

/* Blue birthday button */
.blue-btn {
  display: inline-block;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  padding: 15px 25px;
  color: #fff;
  font-weight: bold;
  text-align: center;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  cursor: pointer;
  margin-top: 20px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
  transition: all 0.3s;
}

.blue-btn:hover {
  background: linear-gradient(135deg, #3a8dde, #00c6ff);
  transform: scale(1.05);
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
}
</style>
</head>
<body>

<div class="cover" id="cover">
  <div class="content">
    <img src="8bdd5cad0dca933d7ef52b353ef09aea.gif" alt="">
    <span>Do you love me?</span>
    <div>
      <button class="tombol iya" onclick="proses(this)" value="iya">Yes</button>
      <button class="tombol tidak" onclick="proses(this)" value="tidak" id="tidak">No</button>
    </div>
  </div>
</div>

<center>
  <button class="blue-btn" onclick="window.location.href = 'project2.html';">🎉 CLICK ME! 🎂</button>
</center>

<script>
const img = document.querySelector("img");
const span = document.querySelector("span");
const btn = document.querySelector("#tidak");
let klakKlik = 0;

let proses = (a)=>{
  if(a.value == "iya"){
    img.src = "f048598f500480b318789fd896f2ca09.gif";
    btn.style.bottom = "-80px";
    btn.style.right = "20px";
    span.innerText = "I love you so much, Daniella Clarisse! 🤍";
    alert("NYE NYE");
    alert("HAPPY BIRTHDAY AGAIN! MWA 🤪");
    if(btn.style.opacity == "0"){
      btn.style.opacity = "1";
      klakKlik = 5;
    }
  }else if(a.value == "tidak"){
    klakKlik++;
    img.src = "415ec7a8d9bded6c901b3858caba5358.gif";
    if(klakKlik > 10){
      btn.style.opacity = "0";
      span.innerText = "AW, MY BABY DOESN'T LOVE ME ANYMOREEE 🥺";
    }else{
      span.innerText = "ABA 🤨";
    }
    let randomPosisi = Math.floor(Math.random() * 400);
    a.style.bottom= randomPosisi * 1.02 + "px";
    a.style.right = randomPosisi / 2 + "px";
  }
}
</script>
