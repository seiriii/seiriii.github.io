<style>
@import url('https://fonts.googleapis.com/css2?family=Rubik+Gemstones&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Anton&display=swap');

* {
  padding: 0;
  margin: 0;
  box-sizing: border-box;
  font-family: arial;
}

/* Gray theme */
body {
  background: #1f1f1f; /* darker gray background */
  color: #c0c0c0; /* light gray text */
}

.cover {
  width: 100%;
  height: 120vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.content {
  width: 300px;
  height: 300px;
  background: repeating-linear-gradient(
    to bottom,
    #2c2c2c 0px,
    #2c2c2c 27px,
    #3a3a3a 28px
  ); /* darker paper lines */
  color: #e0e0e0; /* light gray text */
  display: flex;
  position: absolute;
  justify-content: center;
  border-radius: 5px;
  top: 15%;
  flex-direction: column;
  align-items: center;
  padding: 20px;
}

img {
  width: 200px;
  height: 200px;
}

span {
  font-family: 'Rubik Gemstones', cursive;
  font-size: 1.3em;
  margin: 10px 0;
  color: #d0d0d0; /* slightly lighter gray for emphasis */
}

button {
  position: absolute;
  bottom: -80px;
  height: 45px;
  width: 100px;
  background-color: rgba(192,192,192,0.2); /* semi-transparent gray */
  border: none;
  border-radius: 3px;
  transition: 0.3s;
  letter-spacing: 1px;
  cursor: pointer;
  font-family: 'Anton', sans-serif;
  color: #f0f0f0; /* button text in light gray */
}

button:hover {
  transform: scale(1.1);
  background-color: rgba(192,192,192,0.4); /* slightly brighter hover */
}

/* Gray birthday button */
.blue-btn {
  display: inline-block;
  background: linear-gradient(135deg, #6b6b6b, #9e9e9e); /* gray gradient */
  padding: 15px 25px;
  color: #f0f0f0; /* light gray text */
  font-weight: bold;
  text-align: center;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  cursor: pointer;
  margin-top: 20px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
  transition: all 0.3s;
}

.blue-btn:hover {
  background: linear-gradient(135deg, #7d7d7d, #b0b0b0); /* lighter gray hover */
  transform: scale(1.05);
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);

}
</style>
</head>
<body>
<div class="cover" id="cover">
  <div class="content">
    <img src="8bdd5cad0dca933d7ef52b353ef09aea.gif" alt="">
    <span>Do you love me?</span>
    <button class="tombol iya" onclick="proses(this)" value="iya">Yes</button>
    <button class="tombol tidak" onclick="proses(this)" value="tidak" id="tidak">No</button>
  </div>
</div>

<center>
  <button class="blue-btn" onclick="window.location.href = 'vids.html';">CLICK ME! 🎂</button>
</center>

<script>
const img = document.querySelector("img")
const span = document.querySelector("span")
const btn = document.querySelector("#tidak")
let klakKlik = 0
let proses = (a)=>{
  if(a.value == "iya"){
    img.src = "f048598f500480b318789fd896f2ca09.gif"
    btn.style.bottom = "-80px"
    btn.style.right = "20px"
    span.innerText = "I love you so much, Daniella Clarisse! 🤍"
    alert("NYE NYE")
    alert("HAPPY BIRTHDAY AGAIN! MWA 🤪");
    if(btn.style.opacity == "0"){
      btn.style.opacity = "1"
      klakKlik = 5
    }
  }else if(a.value == "tidak"){
    klakKlik++
    img.src = "9f4f0f07aa3ba6ee248b93cc8df52cd6.gif"
    if(klakKlik > 10){
      btn.style.opacity = "0"
      span.innerText = "AW, MY BABY DOESN'T LOVE ME ANYMOREEE 🥺"
    }else{
      span.innerText = "ABA 🤨"
    }
    img.src = "415ec7a8d9bded6c901b3858caba5358.gif"
    let randomPosisi = Math.floor(Math.random() * 400)
    a.style.bottom= randomPosisi * 1.02 + "px"
    a.style.right = randomPosisi / 2 + "px"
  }
}
</script>
