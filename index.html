    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik+Gemstones&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Anton&display=swap');
        
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: arial;
        }
        .cover{
            width: 100%;
            height: 120vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background:linear-gradient(50deg,#b0d2ff,#5b7ca1);
        }
        .content{
            width: 300px;
            height: 300px;
            background-color: rgba(255, 255, 255, 0.329);
            display: flex;
            position: absolute;
            justify-content: center;
            border-radius: 5px;
            top: 15%;
        }
        img{
            width: 200px;
            height: 200px;
            position: absolute;
            top: 0;
        }
        button{
            position: absolute;
            bottom: -80px;
            height: 45px;
            width: 100px;
            background-color: rgba(255,255,255, .3);
            border: none;
            border-radius: 3px;
            transition: .3s;
            letter-spacing: 1px;
            cursor: pointer;
            font-family: 'Anton', sans-serif;
        }
        button:hover {
            transform: scale(1.1);
        }
        .iya{
            left: 20px;
        }
        .tidak{
            right: 20px;
        }
        span{
            position: absolute;
            bottom: 20%;
            font-family: 'Rubik Gemstones', cursive;
            width: 100%;
            background-color: transparent;
            padding: 0 20px;
            font-size: 1.3em;
            text-align: center;
        }
        button, .content{
            box-shadow: 0 0 4px rgba(0,0,0, .4);
        }
        h3{
            position: absolute;
            bottom: 10px;
            letter-spacing: 2px;
            font-size: 8px;
            font-family: arial;
        }

        /* Blue birthday button */
        .blue-btn {
            display: inline-block;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            padding: 15px 25px;
            color: #fff;
            font-weight: bold;
            text-align: center;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s;
        }
        .blue-btn:hover {
            background: linear-gradient(135deg, #3a8dde, #00c6ff);
            transform: scale(1.05);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);

<body>

                alert("NYE NYE")

                if(klakKlik > 10){
